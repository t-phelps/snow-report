name: Run snow report daily

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  cron-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run script
        run: npm run dev
